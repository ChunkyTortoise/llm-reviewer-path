name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked --group dev
      - run: uv run --no-sync mypy --strict receipts tests
      - run: uv run --no-sync ruff check receipts tests
      - run: uv run pytest
