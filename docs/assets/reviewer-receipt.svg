<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 600" role="img" aria-labelledby="title desc">
  <title id="title">Offline evaluation and approval receipt</title>
  <desc id="desc">Verified local fixture output: good passes, mutation fails, missing approval is denied, one approved execution, duplicate suppressed. Editorial summary, not production authorization.</desc>
  <style>:root{--bg:#f4f1e8;--panel:#fffcf4;--ink:#142029;--muted:#4b5b63;--line:#c8d0cf;--pass:#136c4a;--fail:#9a2b2b}@media(prefers-color-scheme:dark){:root{--bg:#0d151b;--panel:#15222b;--ink:#f5f1e8;--muted:#bac6ca;--line:#3d4d56;--pass:#7ad7ac;--fail:#ff9292}}text{font-family:Arial,sans-serif;fill:var(--ink)}.small{font-size:17px;fill:var(--muted)}.body{font-size:21px}.status{font-size:21px;font-weight:700}</style>
  <rect width="460" height="600" rx="20" fill="var(--bg)"/>
  <text x="26" y="38" class="small">LLM-REVIEWER-PATH / OFFLINE FIXTURES</text>
  <text x="26" y="83" font-size="34" font-weight="700">Run it. Inspect the result.</text>
  <text x="26" y="114" class="small">Editorial summary of captured Python output</text>
  <rect x="24" y="140" width="412" height="133" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="42" y="173" class="small">TWO RUNS / FIVE CASES EACH</text>
  <text x="42" y="214" class="body">GOOD · 1.00</text>
  <text x="414" y="214" text-anchor="end" class="status" style="fill:var(--pass)">PASS</text>
  <text x="42" y="251" class="body">MUTATION · 0.80</text>
  <text x="414" y="251" text-anchor="end" class="status" style="fill:var(--fail)">FAIL</text>
  <text x="26" y="313" class="small">APPROVAL / IN-MEMORY CONTACT UPDATE</text>
  <text x="26" y="354" class="small">01</text>
  <text x="65" y="354" class="body">No token: write denied</text>
  <text x="26" y="394" class="small">02</text>
  <text x="65" y="394" class="body">Model text: ApprovalError</text>
  <text x="26" y="434" class="small">03</text>
  <text x="65" y="434" class="body">Issued token: execute once</text>
  <text x="26" y="474" class="small">04</text>
  <text x="65" y="474" class="body">Retry: duplicate suppressed</text>
  <line x1="26" y1="506" x2="434" y2="506" stroke="var(--line)"/>
  <text x="26" y="538" class="small">Local teaching example. No live CRM.</text>
  <text x="26" y="566" class="small">Read the receipt for reproduction and limits.</text>
</svg>
