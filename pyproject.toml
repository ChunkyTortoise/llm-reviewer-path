[project]
name = "llm-reviewer-path"
version = "0.1.0"
description = "A 10-minute runnable code sample: offline eval gates, approval-bound writes, and idempotent retries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["receipts"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "mypy==1.11.2", "ruff==0.15.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["receipts", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
force-exclude = true

[tool.ruff.format]
# Test files are left unformatted (commit gate blocks reformatted assertion lines).
exclude = ["test_*.py", "*_test.py", "*.test.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["receipts"]
omit = ["tests/*", "*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
fail_under = 80
